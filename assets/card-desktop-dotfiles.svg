<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 150" width="460" height="150" role="img" aria-label="Desktop-Dotfiles">
<title>Desktop-Dotfiles</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="460" y2="150" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#070C1A"/><stop offset="1" stop-color="#0D1030"/></linearGradient>
  <linearGradient id="rim" x1="0" y1="0" x2="460" y2="150" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#19F0DC" stop-opacity=".6"/><stop offset=".6" stop-color="#4FA8FF" stop-opacity=".2"/><stop offset="1" stop-color="#FF4FB8" stop-opacity=".5"/></linearGradient>
  <linearGradient id="bar" x1="0" y1="0" x2="460" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#19F0DC"/><stop offset=".5" stop-color="#4FA8FF"/><stop offset="1" stop-color="#FF4FB8"/></linearGradient>
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#4FA8FF" stroke-opacity=".06"/></pattern>
  <linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#19F0DC" stop-opacity=".12"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <clipPath id="c"><rect x="1" y="1" width="458" height="148" rx="14"/></clipPath>
</defs>
<rect width="460" height="150" rx="14" fill="url(#bg)"/>
<rect width="460" height="150" rx="14" fill="url(#grid)"/>
<g clip-path="url(#c)"><rect x="-120" y="0" width="120" height="150" fill="url(#sh)"><animate attributeName="x" values="-120;460" dur="6s" repeatCount="indefinite"/></rect>
<rect x="0" y="0" width="460" height="3" fill="url(#bar)"/></g>
<g font-family="'JetBrains Mono','Cascadia Code','Fira Code',Consolas,'DejaVu Sans Mono',Menlo,monospace">
  <path d="M24 26 h8 l3 3 h9 v14 h-20 z" fill="none" stroke="#19F0DC" stroke-width="1.6" stroke-linejoin="round"/>
  <text x="54" y="42" font-size="16" font-weight="700" fill="#19F0DC" textLength="163.2" lengthAdjust="spacing">Desktop-Dotfiles</text>
  
  <text x="24" y="78" font-size="12.5" fill="#B8C7E6">Luxury White Waybar Setup.</text>
<text x="24" y="97" font-size="12.5" fill="#B8C7E6">Arch Linux + Hyprland aesthetic.</text>

  <circle cx="30" cy="130" r="5" fill="#8B4FD0"/>
  <text x="42" y="134" font-size="12" fill="#8DA2C6">CSS</text>
  <text x="436" y="134" font-size="11" fill="#4FA8FF" fill-opacity=".8" text-anchor="end">github.com/vuphitung  →</text>
</g>
<rect x="1" y="1" width="458" height="148" rx="14" fill="none" stroke="url(#rim)" stroke-width="1.3"/>
</svg>